services:
  api:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:3333:3333"
    env_file:
      - .env
    environment:
      # O FakeCloud publica a porta no host; de dentro do container usamos
      # host.docker.internal (adicionado a allowed-list em src/config/env.ts).
      AWS_ENDPOINT_URL: http://host.docker.internal:4566
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3333/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    stop_grace_period: 10s
